<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Information</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --panel: #0f172a;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #fbbf24;        /* amber/gold */
            --accent-soft: rgba(251, 191, 36, 0.14);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue",
                Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 4vw, 2rem);
            background: radial-gradient(circle at 50% 0%, rgb(246, 148, 164));
            color: var(--text);
        }

        .card {
            width: 100%;
            max-width: 540px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: clamp(1.5rem, 5vw, 2.5rem);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.01em;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            font-size: clamp(0.85rem, 2.5vw, 0.95rem);
            color: var(--muted);
            font-style: italic;
            margin-bottom: 1.5rem;
        }

        #bookDetails {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        /* Each generated <p> becomes a small info panel with a gold side-bar */
        #bookDetails p {
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            line-height: 1.5;
            color: var(--text);
        }

        /* Plain-text error message (when fetch fails) */
        #bookDetails:has(:not(p)) {
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Book Information</h1>
        <p class="subtitle">Loaded asynchronously from books.json</p>
        <div id="bookDetails"></div>
    </main>

    <script>
        async function loadBooks() {

            const display = document.getElementById("bookDetails");

            try {

                // Fetch data daripada books.json
                const response = await fetch("books.json");

                // Periksa jika request berjaya
                if (!response.ok) {
                    throw new Error("Unable to load books.json");
                }

                // Tukar JSON kepada JavaScript object
                const data = await response.json();

                // Paparkan tajuk buku pertama
                const firstTitle = document.createElement("p");
                firstTitle.textContent =
                    "First Book Title: " + data.books[0].title;

                display.appendChild(firstTitle);

                // Paparkan author buku kedua
                const secondAuthor = document.createElement("p");
                secondAuthor.textContent =
                    "Second Book Author: " + data.books[1].author;

                display.appendChild(secondAuthor);

                // Paparkan genres untuk kedua-dua buku
                data.books.forEach(function(book) {

                    const bookGenre = document.createElement("p");

                    bookGenre.textContent =
                        book.title + " — " + book.genres.join(", ");

                    display.appendChild(bookGenre);

                });

            } catch (error) {

                display.textContent =
                    "Error: Unable to retrieve book data.";

                console.error(error);

            }
        }

        // Panggil function
        loadBooks();

    </script>
</body>
</html>
