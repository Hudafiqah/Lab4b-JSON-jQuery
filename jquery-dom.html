<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jQuery DOM Manipulation</title>

    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV"
        crossorigin="anonymous"></script>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        /* Spacing via CSS margins instead of <br> (cleaner, responsive) */
        #myElement,
        #myDIV,
        #myButton {
            margin-top: 1rem;
        }
        .myStyle {
            background-color: coral;
            padding: 16px;
        }
    </style>
</head>
<body>

    <h1>jQuery DOM Manipulation</h1>

    <!-- Element 1 -->
    <div id="myElement">Original Text</div>

    <!-- Element 2 -->
    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <!-- Button -->
    <button id="myButton" type="button">Click me</button>

    <script>
        // Run once the DOM is ready (idiomatic jQuery — robust against
        // where the script tag is placed in the page).
        $(function () {

            // (a) Change text using jQuery
            $("#myElement").text("Modified Text");

            // (b) Add CSS class using jQuery
            $("#myDIV").addClass("myStyle");

            // (c) Handle button click using jQuery
            $("#myButton").on("click", function () {
                alert("Button clicked!");
            });

        });
    </script>
</body>
</html>
